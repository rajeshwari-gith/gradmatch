[project]
name = "gradmatch"
version = "0.1.0"
description = "Find graduate programs, funding, scholarships and deadlines."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "app"]
testpaths = ["tests"]
markers = [
    "unit: tests one function or module on its own",
    "integration: tests modules working together (database, API)",
    "system: tests the whole Streamlit app",
    "acceptance: tests a user story end to end",
]

[tool.coverage.run]
source = ["src/gradmatch", "app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/gradmatch/cost.py", "src/gradmatch/fit.py", "src/gradmatch/funding.py",
                "src/gradmatch/validation.py", "src/gradmatch/search.py",
                "src/gradmatch/data_loader.py", "src/gradmatch/scholarships.py",
                "src/gradmatch/deadlines.py", "src/gradmatch/exports.py"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["tests/", "src/gradmatch/__init__.py", "src/gradmatch/models.py",
             "src/gradmatch/presentation.py", "src/gradmatch/link_check.py", "pyproject.toml"]
