[project]
name = "gradmatch"
version = "0.2.0"
description = "Find master's programs a student can afford."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/gradmatch", "app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
